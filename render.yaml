services:
  - type: web
    name: whatsapp-insights-llm
    runtime: docker
    plan: starter
    region: oregon
    envVars:
      - key: PORT
        value: "10000"
      - key: HOST
        value: "0.0.0.0"
      - key: HEADLESS
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
    disk:
      name: whatsapp-data
      mountPath: /app/data
      sizeGB: 1
